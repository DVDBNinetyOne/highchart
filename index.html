<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninety One — Highcharts Chart Builder</title>

<!-- Highcharts 11.2.0 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.2.0/highcharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.2.0/modules/data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.2.0/modules/annotations.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.2.0/modules/accessibility.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.2.0/modules/drilldown.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.2.0/modules/bubble.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.2.0/modules/sunburst.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.2.0/modules/packed-bubble.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.2.0/modules/treemap.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
/* ─── Reset & Base ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:     #009d80;
  --nav:       #1a1a1a;
  --teal:      #164848;
  --sidebar-w: 320px;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 13px;
  background: #f5f5f5;
  color: #1a1a1a;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── Top Bar ─── */
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #1a1a1a;
  padding: 0 16px;
  height: 48px;
  flex-shrink: 0;
  z-index: 100;
  width: 100%;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
}

.logo svg {
  width: 20px;
  height: 20px;
}

.nav-tabs {
  display: flex;
  gap: 0;
}

.nav-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: #fff;
  font-size: 13px;
  height: 48px;
  padding: 0 16px;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.15s;
}

.nav-tab.active {
  border-bottom-color: #009d80;
}

.nav-tab:hover:not(.active) {
  border-bottom-color: rgba(255,255,255,0.3);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-outline {
  border: 1px solid rgba(255,255,255,0.5);
  color: #fff;
  background: none;
  border-radius: 4px;
  padding: 5px 12px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
.btn-outline:hover { background: rgba(255,255,255,0.1); }

.btn-filled {
  background: #009d80;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 5px 12px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 600;
  font-family: inherit;
  transition: background 0.15s;
}
.btn-filled:hover { background: #007d66; }

/* ─── App Body ─── */
#app {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ─── Main Area (left + centre) ─── */
#main-area {
  flex: 1;
  background: #f5f5f5;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

/* ─── Right Sidebar ─── */
#settings-sidebar {
  width: var(--sidebar-w);
  background: #fff;
  border-left: 1px solid #e8e8e8;
  overflow-y: auto;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}

/* ─── Cards ─── */
.card {
  background: #fff;
  margin: 20px;
  border-radius: 6px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  padding: 24px;
}

/* ─── Preview Tab ─── */
#preview-tab-content {
  display: flex;
  flex-direction: column;
  padding: 0;
}

.theme-toggle-wrap {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 12px;
}

.theme-pill {
  display: inline-flex;
  border: 1px solid #ddd;
  border-radius: 20px;
  overflow: hidden;
  background: #f0f0f0;
}

.theme-pill button {
  background: none;
  border: none;
  padding: 4px 14px;
  font-size: 12px;
  cursor: pointer;
  color: #888;
  font-family: inherit;
  border-radius: 20px;
  transition: background 0.15s, color 0.15s;
}

.theme-pill button.active {
  background: #333;
  color: #fff;
}

#chart-container {
  width: 100%;
  min-height: 450px;
}

/* Config card */
.config-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #888;
  font-weight: 600;
}

.pre-wrap {
  position: relative;
  margin-top: 8px;
}

pre#config-output {
  max-height: 180px;
  overflow-y: auto;
  background: #f8f8f8;
  font-family: monospace;
  font-size: 11px;
  padding: 12px;
  border-radius: 4px;
  white-space: pre;
  margin: 0;
}

.copy-btn-small {
  position: absolute;
  top: 6px;
  right: 6px;
  background: #009d80;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
.copy-btn-small:hover { background: #007d66; }

/* ─── Data Tab ─── */
#data-tab-content {
  display: none;
  flex-direction: column;
  padding: 0;
}

.data-toolbar {
  background: #fff;
  margin: 20px 20px 0;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-radius: 6px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

.data-toolbar-hint {
  font-size: 12px;
  color: #888;
}

.spreadsheet-card {
  margin: 0 20px 20px;
  background: #fff;
  border-radius: 6px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  overflow-x: auto;
}

#data-grid {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}

.row-num-col {
  width: 40px;
  color: #888;
  background: #fafafa;
  border-right: 1px solid #e8e8e8;
  text-align: center;
  font-size: 11px;
  padding: 0;
  user-select: none;
}

#data-grid th {
  background: #fafafa;
  border-bottom: 1px solid #e8e8e8;
  border-right: 1px solid #e8e8e8;
  padding: 0;
  position: relative;
}

.col-header-wrap {
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.col-type-badge {
  font-size: 10px;
  color: #888;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.col-name-input {
  border: none;
  outline: none;
  font-size: 13px;
  font-weight: 600;
  color: #333;
  background: transparent;
  width: 100%;
  padding: 0;
  font-family: inherit;
}
.col-name-input:focus { background: #f0faf8; }

#data-grid td {
  border-bottom: 1px solid #e8e8e8;
  border-right: 1px solid #e8e8e8;
  padding: 0;
}

#data-grid td input {
  width: 100%;
  border: none;
  outline: none;
  padding: 6px 8px;
  font-size: 13px;
  background: transparent;
  color: #333;
  font-family: inherit;
}
#data-grid td input:focus { background: #f0faf8; }

.row-del-btn {
  display: none;
  width: 18px;
  height: 18px;
  background: #fee;
  border: none;
  border-radius: 3px;
  color: #d83949;
  font-size: 10px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}

#data-grid tr:hover .row-del-btn { display: flex; }

.add-row-cell {
  text-align: center;
  color: #009d80;
  cursor: pointer;
  padding: 8px;
  font-size: 12px;
  border-top: 1px solid #e8e8e8;
  font-weight: 600;
}

.add-series-th {
  width: 40px;
  text-align: center;
  color: #009d80;
  cursor: pointer;
  font-size: 18px;
  background: #fafafa;
}

.example-banner {
  background: #fffbea;
  border-bottom: 1px solid #f0e68c;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: #7a6500;
}

.example-banner button {
  background: none;
  border: none;
  cursor: pointer;
  color: #7a6500;
  font-size: 16px;
  line-height: 1;
}

/* ─── Settings Sidebar ─── */
.sidebar-type-btn {
  width: 100%;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: none;
  background: none;
  border-bottom: 1px solid #e8e8e8;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: #333;
  font-family: inherit;
}
.sidebar-type-btn:hover { background: #fafafa; }

.sidebar-type-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-divider {
  height: 1px;
  background: #e8e8e8;
}

.accordion-section {
  border-bottom: 1px solid #e8e8e8;
}

.accordion-header {
  width: 100%;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #888;
  font-family: inherit;
}
.accordion-header:hover { background: #fafafa; }

.accordion-header .chevron {
  transition: transform 0.2s;
  color: #bbb;
}
.accordion-header.open .chevron { transform: rotate(180deg); }

.accordion-body {
  display: none;
  padding: 12px 16px 16px;
}
.accordion-body.open { display: block; }

.field-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.field-row label {
  font-size: 12px;
  color: #555;
  min-width: 90px;
  flex-shrink: 0;
}

.field-input {
  height: 32px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 13px;
  padding: 0 10px;
  flex: 1;
  min-width: 0;
  outline: none;
  font-family: inherit;
}
.field-input:focus {
  border-color: #009d80;
  box-shadow: 0 0 0 2px rgba(0,157,128,0.12);
}

.toggle-pill {
  display: inline-flex;
  width: 36px;
  height: 20px;
  border-radius: 10px;
  background: #ccc;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  border: none;
  flex-shrink: 0;
}
.toggle-pill.on { background: #009d80; }
.toggle-pill::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  top: 2px;
  left: 2px;
  transition: left 0.2s;
}
.toggle-pill.on::after { left: 18px; }

.seg-group {
  display: flex;
  border: 1px solid #ddd;
  border-radius: 4px;
  overflow: hidden;
}

.seg-btn {
  flex: 1;
  padding: 5px 8px;
  border: none;
  background: #fff;
  font-size: 12px;
  color: #888;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s, color 0.15s;
}
.seg-btn.active { background: #333; color: #fff; }

.colour-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
}

.colour-swatch {
  width: 20px;
  height: 20px;
  border-radius: 3px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.1s;
}
.colour-swatch:hover { transform: scale(1.15); }
.colour-swatch.selected { border-color: #333; }

.series-colour-section {
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid #f0f0f0;
}
.series-colour-section:last-child { border-bottom: none; }

.series-name-label {
  font-size: 12px;
  font-weight: 600;
  color: #333;
  margin-bottom: 6px;
}

.hex-input {
  width: 72px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 11px;
  padding: 0 6px;
  height: 26px;
  font-family: monospace;
  outline: none;
}

.sidebar-search {
  padding: 12px 16px;
  border-top: 1px solid #e8e8e8;
  position: sticky;
  bottom: 0;
  background: #fff;
}

.sidebar-search input {
  width: 100%;
  height: 32px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 12px;
  padding: 0 10px;
  outline: none;
  font-family: inherit;
}
.sidebar-search input:focus { border-color: #009d80; }

/* ─── Chart Type Picker Overlay ─── */
#type-picker-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 600;
}
#type-picker-overlay.open { display: flex; }

#type-picker-modal {
  background: #fff;
  border-radius: 8px;
  padding: 24px;
  max-width: 720px;
  width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
}

.picker-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.picker-header h2 {
  font-size: 18px;
  font-weight: 600;
  color: #333;
}

.picker-close {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: #888;
  line-height: 1;
}

.picker-group-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #888;
  margin: 16px 0 8px;
}

.picker-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}

.picker-card {
  width: 100%;
  height: 100px;
  border: 2px solid #eee;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  background: #fff;
  transition: border-color 0.15s;
  padding: 8px;
  font-family: inherit;
}
.picker-card:hover { border-color: #009d80; }
.picker-card.selected { border-color: #009d80; background: #f0faf8; }
.picker-card.dev-card { opacity: 0.4; pointer-events: none; }

.picker-card-name {
  font-size: 13px;
  font-weight: 600;
  color: #333;
}

.picker-card-desc {
  font-size: 11px;
  color: #888;
  text-align: center;
}

/* ─── Import Wizard Overlay ─── */
#import-wizard-btn {
  background: rgba(255,255,255,0.12);
  border: none;
  color: #fff;
  border-radius: 4px;
  padding: 5px 12px;
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: background 0.15s;
  font-family: inherit;
}
#import-wizard-btn:hover { background: rgba(255,255,255,0.22); }

#import-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(22,72,72,0.55);
  backdrop-filter: blur(3px);
  z-index: 900;
  align-items: center;
  justify-content: center;
}
#import-overlay.open { display: flex; }

#import-modal {
  background: #fff;
  border-radius: 12px;
  width: 680px;
  max-width: 95vw;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0,0,0,0.28);
  display: flex;
  flex-direction: column;
}

#import-modal-header {
  background: #164848;
  color: #fff;
  padding: 18px 24px 14px;
  border-radius: 12px 12px 0 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
#import-modal-header h2 { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
#import-modal-header p  { font-size: 12px; color: #7ab5b5; }

#import-close-btn {
  background: none;
  border: none;
  color: rgba(255,255,255,0.6);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
  padding: 0 0 0 12px;
}
#import-close-btn:hover { color: #fff; }

/* Step indicator */
#import-steps {
  display: flex;
  gap: 0;
  padding: 16px 24px 0;
  border-bottom: 1px solid #eee;
  background: #fafafa;
}

.import-step {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 12px;
  flex: 1;
  font-size: 12px;
  color: #aaa;
  position: relative;
}

.import-step::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 1px;
  background: #ddd;
}
.import-step:last-child::after { display: none; }

.import-step .step-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ddd;
  color: #888;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.import-step.active .step-num { background: #009d80; color: #fff; }
.import-step.done   .step-num { background: #164848; color: #fff; }
.import-step.active { color: #164848; font-weight: 600; }
.import-step.done   { color: #164848; }

#import-body { padding: 24px; flex: 1; }

/* Drop zones */
.drop-zone {
  border: 2px dashed #d4cfc4;
  border-radius: 10px;
  padding: 36px 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  background: #fafaf8;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: #009d80;
  background: #f0faf7;
}

.drop-zone .drop-icon {
  font-size: 36px;
  margin-bottom: 10px;
  display: block;
}
.drop-zone h3 { font-size: 15px; color: #1a1a1a; margin-bottom: 6px; }
.drop-zone p  { font-size: 12px; color: #888; line-height: 1.5; }

.drop-zone .drop-or {
  margin: 12px 0;
  font-size: 11px;
  color: #bbb;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.drop-zone input[type=file] { display: none; }

.drop-zone .browse-link {
  color: #009d80;
  text-decoration: underline;
  cursor: pointer;
  font-size: 12px;
}

.drop-zone.has-file {
  border-color: #009d80;
  background: #f0faf7;
}
.drop-zone.has-file .drop-icon { font-size: 28px; }

.file-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #c8e0e0;
  color: #164848;
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  margin-top: 8px;
}

.file-badge button {
  background: none;
  border: none;
  cursor: pointer;
  color: #164848;
  font-size: 14px;
  line-height: 1;
  padding: 0;
}

/* AI read result */
#ai-read-result {
  background: #f0faf7;
  border: 1px solid #c8e0e0;
  border-radius: 8px;
  padding: 16px;
  margin-top: 16px;
  display: none;
}
#ai-read-result h4 {
  font-size: 12px;
  color: #164848;
  font-weight: 700;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.ai-read-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(0,157,128,0.12);
  font-size: 12px;
}
.ai-read-row:last-child { border-bottom: none; }

.ai-read-label { color: #666; min-width: 110px; flex-shrink: 0; }
.ai-read-value { color: #1a1a1a; font-weight: 500; }

.ai-read-value .colour-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  margin-right: 4px;
  vertical-align: middle;
}

#ai-confidence {
  margin-top: 10px;
  font-size: 11px;
  color: #888;
  display: flex;
  align-items: center;
  gap: 8px;
}

#ai-confidence-bar {
  flex: 1;
  height: 4px;
  background: #ddd;
  border-radius: 2px;
  overflow: hidden;
}

#ai-confidence-fill {
  height: 100%;
  background: #009d80;
  border-radius: 2px;
  transition: width 0.4s;
}

/* CSV mapper */
#csv-mapper { display: none; margin-top: 0; }
#csv-mapper h4 { font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
#csv-mapper p  { font-size: 12px; color: #777; margin-bottom: 14px; }

.mapper-table { width: 100%; border-collapse: collapse; }
.mapper-table th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  padding: 4px 8px 8px;
}
.mapper-table td {
  padding: 5px 8px;
  vertical-align: middle;
  font-size: 12px;
  border-bottom: 1px solid #f0eeea;
}
.mapper-table select {
  border: 1px solid #d4cfc4;
  border-radius: 4px;
  padding: 3px 6px;
  font-size: 12px;
  background: #fff;
  color: #1a1a1a;
  width: 100%;
}
.mapper-table .col-preview { color: #888; font-size: 11px; font-style: italic; }
.csv-preview-note { font-size: 11px; color: #aaa; margin-top: 8px; }

/* Step 3 — confirm */
#import-confirm-summary {
  background: #fafafa;
  border: 1px solid #eee;
  border-radius: 8px;
  padding: 16px;
  font-size: 12px;
  color: #444;
  line-height: 1.8;
}
#import-confirm-summary strong { color: #164848; }

/* Wizard nav buttons */
#import-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-top: 1px solid #eee;
  background: #fafafa;
  border-radius: 0 0 12px 12px;
}

.import-nav-back {
  background: none;
  border: 1px solid #d4cfc4;
  color: #555;
  border-radius: 4px;
  padding: 7px 16px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}
.import-nav-back:hover { background: #f5f3ec; }

.import-nav-next {
  background: #009d80;
  border: none;
  color: #fff;
  border-radius: 4px;
  padding: 8px 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
}
.import-nav-next:hover { background: #007d66; }
.import-nav-next:disabled { opacity: 0.45; cursor: not-allowed; }
.import-nav-next .spinner { border-color: rgba(255,255,255,0.3); border-top-color: #fff; }

.wizard-error {
  background: #fff0f0;
  border: 1px solid #f5c0c0;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12px;
  color: #c0392b;
  margin-top: 12px;
  display: none;
}
.wizard-error.visible { display: block; }

/* ─── Modals ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.show { opacity: 1; pointer-events: all; }

.modal {
  background: #fff;
  border-radius: 8px;
  padding: 22px 24px;
  width: 360px;
  max-width: 90vw;
  box-shadow: 0 12px 40px rgba(0,0,0,0.2);
}

/* ─── Toast ─── */
#copy-toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #164848;
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  z-index: 999;
}
#copy-toast.show { opacity: 1; transform: translateY(0); }

/* ─── Spinner ─── */
.spinner {
  width: 13px;
  height: 13px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
.spinner.visible { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Syntax highlight helpers ─── */
.hl-key   { color: #116e62; }
.hl-str   { color: #8b4513; }
.hl-num   { color: #1a5c9a; }
.hl-bool  { color: #7b0d8a; }
.hl-null  { color: #888; }
.hl-punct { color: #555; }
</style>
</head>
